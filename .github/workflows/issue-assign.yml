name: Issue Commands Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  handle-command:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - name: Process issue command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          command=$(printf '%s' "$COMMENT_BODY" | xargs)

          case "$command" in
            /assign)
              issue=$(gh issue view "$ISSUE_NUMBER" \
                --repo "$GH_REPO" \
                --json state,assignees)

              state=$(jq -r '.state' <<< "$issue")
              count=$(jq '.assignees | length' <<< "$issue")

              if [[ "$state" != "OPEN" ]]; then
                gh issue comment "$ISSUE_NUMBER" \
                  --repo "$GH_REPO" \
                  --body "This issue is closed and cannot be claimed."
                exit 0
              fi

              if [[ "$count" -gt 0 ]]; then
                gh issue comment "$ISSUE_NUMBER" \
                  --repo "$GH_REPO" \
                  --body "This issue already has an assignee. Please choose another issue."
                exit 0
              fi

              if gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/assignees" \
                -X POST \
                -f "assignees[]=$COMMENTER" >/dev/null 2>&1; then
                gh issue comment "$ISSUE_NUMBER" \
                  --repo "$GH_REPO" \
                  --body "@$COMMENTER has been assigned this issue!"
              else
                gh issue comment "$ISSUE_NUMBER" \
                  --repo "$GH_REPO" \
                  --body "@$COMMENTER, GitHub could not assign you automatically. Please ask a maintainer for help."
              fi
              ;;

            /lgtm|/approved|/ui|/bug|/docs|/needs-triage)
              label="${command#/}"

              # Create the label if it doesn't exist.
              if ! gh api "repos/$GH_REPO/labels/$label" \
                >/dev/null 2>&1; then
                if ! gh api "repos/$GH_REPO/labels" \
                  -X POST \
                  -f "name=$label" \
                  -f "color=ededed" \
                  -f "description=Added via the issue command bot" \
                  >/dev/null; then
                  gh issue comment "$ISSUE_NUMBER" \
                    --repo "$GH_REPO" \
                    --body "I couldn't create the \`$label\` label. Please ask a maintainer for help."
                  exit 1
                fi
              fi

              # Apply the label to the issue.
              if gh issue edit "$ISSUE_NUMBER" \
                --repo "$GH_REPO" \
                --add-label "$label"; then
                gh issue comment "$ISSUE_NUMBER" \
                  --repo "$GH_REPO" \
                  --body "Added label \`$label\`."
              else
                gh issue comment "$ISSUE_NUMBER" \
                  --repo "$GH_REPO" \
                  --body "The \`$label\` label exists, but I couldn't apply it to this issue."
                exit 1
              fi
              ;;

            *)
              # Ignore unrecognized commands.
              exit 0
              ;;
          esac
